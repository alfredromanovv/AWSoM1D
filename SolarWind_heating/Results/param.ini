 ==============================================================================
# Конфигурационный файл для 1D нестационарной модели солнечного ветра (AWSoM-1D)
# ==============================================================================

[Mode]
# Режим задания параметров:
#   dimensionless — используются напрямую безразмерные комплексы из [Dimensionless]
#   physical      — используются размерные величины СИ из [Physical],
#                   по которым программа автоматически вычисляет безразмерные комплексы
input_mode = dimensionless

[Grid]
# Внутренняя и внешняя границы в радиусах Солнца (R_sun)
r_in  = 1.0
r_out = 30.0

# Число расчётных ячеек
N_cells = 600

# Коэффициент геометрического растяжения сетки q = dr_{i+1} / dr_i
# При q = 1.008 ячейка у r=1 имеет размер ~0.002 R_sun, отлично разрешая переходный слой
grid_stretch = 1.008

[Geometry]
# Тип геометрии магнитной трубки A(r) и dA/dr (задаётся в функциях user_area_A и user_area_dAdr в C++):
#   0 — чисто сферическое (радиальное) расширение: A(r) = r^2, dA/dr = 2*r
#   1 — сверхрадиальное расширение Коппа-Хольцера: A(r) = r^2 * f(r) / f(1)
#   2 — пользовательская аналитическая формула в коде C++
geom_type = 1

# Параметры сверхрадиального расширения (используются при geom_type = 1):
f_max     = 6.5
r_exp     = 1.3
sigma_exp = 0.25

[TransitionRegion]
# Включение модели переходного слоя (электронная теплопроводность + радиационные потери + регуляризация):
#   0 — выключено (упрощённая адиабатическая модель: q = 0, Q_rad = 0)
#   1 — включено (модель Спитцера-Харма + охлаждение Роснера-Таккера-Вайана + уширение Соколова-Лионелло)
enable_tr = 1

# Параметры переходного слоя (для режима dimensionless):
chi_0       = 2.0e-6   # безразмерный коэффициент теплопроводности у основания: kappa_0 * T_0^(7/2) / (R_sun * rho_0 * V_*^3)
lambda_rad  = 0.35     # безразмерный коэффициент радиационных потерь у основания
tau_mod     = 6.0      # безразмерный порог уширения переходного слоя T_mod / T_0 (например, 3e5 К / 5e4 К = 6.0)
r_col       = 5.0      # радиус [R_sun] плавного выключения столкновительной теплопроводности f_c(r) = 1 / (1 + (r/r_col)^2)

# Параметры переходного слоя в СИ (для режима physical):
kappa_0_SI  = 9.0e-12  # коэффициент Спитцера-Харма [Вт / (м * К^(7/2))]
T_mod_SI    = 3.0e5    # пороговая температура регуляризации Линкера-Лионелло-Соколова [К]

[Dimensionless]
# Безразмерные параметры на нижней границе r = 1 (используются при input_mode = dimensionless):
# Масштаб скорости: V_* = sqrt(G * M_sun / R_sun) = 436.7 км/с
gamma   = 1.6666666666666667
theta_0 = 0.0036     # p_0 / (rho_0 * V_*^2) — соответствует хромосферной границе T_0 ~ 50 000 K
V_A0    = 1.50       # V_{A,0} / V_*          — безразмерная скорость Альфвена у основания
alpha_d = 35.0       # 2 * R_sun / L_{perp,0} — безразмерный параметр каскадной диссипации
w_plus0 = 0.08       # w_{+,0} / (rho_0 * V_*^2) — безразмерная плотность энергии выходящих волн

[Physical]
# Физические параметры в системе СИ (используются при input_mode = physical):
G_grav  = 6.67430e-11
M_sun   = 1.98847e30
R_sun   = 6.95700e8
mu_0    = 1.25663706212e-6
k_B     = 1.380649e-23
m_u     = 1.66053906660e-27
mu_mol  = 0.60       # средний молекулярный вес полностью ионизованной плазмы

# Граничные значения у вершины хромосферы (r = R_sun) в единицах СИ:
rho_0      = 2.0e-11   # плотность [кг/м^3] (~1.2e10 см^-3)
T_0        = 5.0e4     # температура [К] (50 000 К — основание переходного слоя)
B_0        = 8.0e-4    # магнитное поле [Тл] (8 Гс)
L_perp0    = 4.0e7     # поперечный корреляционный масштаб турбулентности [м] (40 000 км)
w_plus0_SI = 0.30      # плотность энергии выходящих альфвеновских волн [Дж/м^3]

[Numerics]
# Численная схема потоков: HLL или Rusanov
flux_scheme = HLL

# Лимитер наклонов для MUSCL реконструкции 2-го порядка: minmod, vanleer, superbee, first_order
limiter = vanleer

# Число Куранта (CFL), конечное безразмерное время интегрирования и допуск установления
cfl          = 0.45
t_end        = 60.0
max_steps    = 500000
tol_steady   = 1.0e-7
output_every = 5000

# Параметр гладкой регуляризации для модуля градиента |dV_A/dr| и операторов min/max:
#   0 — точная кусочная формула из постановки (min/max)
#   1 — гладкая регуляризация (гармоническое сглаживание)
smooth_reflection = 0
eps_reg = 1.0e-6

# Число потоков OpenMP (0 — использовать все доступные ядра)
omp_threads = 4

# Имена выходных файлов
output_profile = solution_1d.csv
output_history = convergence_history.csv