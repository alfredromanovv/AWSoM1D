# ==============================================================================
# Конфигурационный файл для 1D нестационарной модели солнечного ветра # ==============================================================================

[Mode]
# Режим задания параметров:
#   dimensionless — используются напрямую безразмерные комплексы из [Dimensionless]
#   physical      — используются размерные величины СИ из [Physical],
#                   по которым программа автоматически вычисляет безразмерные комплексы
input_mode = dimensionless

[Grid]
# Внутренняя и внешняя границы в радиусах Солнца (R_sun)
r_in  = 1.0
r_out = 30.0

# Число расчётных ячеек
N_cells = 600

# Коэффициент геометрического растяжения сетки q = dr_{i+1} / dr_i
# При q = 1.0 сетка равномерная; при q = 1.008 ячейка у r=1 имеет размер ~0.002 R_sun
grid_stretch = 1.008

[Geometry]
# Тип геометрии магнитной трубки A(r) и dA/dr (задаётся также в функциях area_A и area_dAdr в C++):
#   0 — чисто сферическое (радиальное) расширение: A(r) = r^2, dA/dr = 2*r
#   1 — сверхрадиальное расширение Коппа-Хольцера: A(r) = r^2 * f(r) / f(1)
#   2 — пользовательская степенная/полиномиальная формула в коде C++
geom_type = 1

# Параметры сверхрадиального расширения (используются при geom_type = 1):
f_max  = 6.5
r_exp  = 1.3
sigma_exp = 0.25

[Dimensionless]
# Безразмерные параметры на нижней границе r = 1 (используются при input_mode = dimensionless):
# Масштаб скорости: V_* = sqrt(G * M_sun / R_sun) = 436.7 км/с
gamma   = 1.6666666666666667
theta_0 = 0.005      # p_0 / (rho_0 * V_*^2) — квадрат безразмерной изотермической скорости звука
V_A0    = 1.50       # V_{A,0} / V_*          — безразмерная скорость Альфвена у основания
alpha_d = 35.0       # 2 * R_sun / L_{perp,0} — безразмерный параметр каскадной диссипации
w_plus0 = 0.08       # w_{+,0} / (rho_0 * V_*^2) — безразмерная плотность энергии выходящих волн

[Physical]
# Физические параметры в системе СИ (используются при input_mode = physical):
G_grav  = 6.67430e-11
M_sun   = 1.98847e30
R_sun   = 6.95700e8
mu_0    = 1.25663706212e-6
k_B     = 1.380649e-23
m_u     = 1.66053906660e-27
mu_mol  = 0.60       # средний молекулярный вес полностью ионизованной водородно-гелиевой плазмы

# Граничные значения у основания (r = R_sun) в единицах СИ:
rho_0    = 1.5e-11   # плотность [кг/м^3] (~9e9 см^-3, верхняя хромосфера / переходный слой)
T_0      = 7.0e4     # температура [К]
B_0      = 8.0e-4    # магнитное поле [Тл] (8 Гс)
L_perp0  = 4.0e7     # поперечный корреляционный масштаб турбулентности [м] (40 000 км)
w_plus0_SI = 0.22    # плотность энергии выходящих альфвеновских волн [Дж/м^3]

[Numerics]
# Численная схема потоков: HLL или Rusanov
flux_scheme = HLL

# Лимитер наклонов для MUSCL реконструкции 2-го порядка: minmod, vanleer, superbee, first_order
limiter = vanleer

# Число Куранта (CFL), конечное безразмерное время интегрирования и допуск установления
cfl         = 0.45
t_end       = 60.0
max_steps   = 500000
tol_steady  = 1.0e-7
output_every = 5000

# Параметр гладкой регуляризации для модуля градиента |dV_A/dr| и операторов min/max:
#   0 — точная кусочная формула из постановки (min/max)
#   1 — гладкая регуляризация (гармоническое сглаживание)
smooth_reflection = 0
eps_reg = 1.0e-6

# Число потоков OpenMP (0 — использовать все доступные ядра)
omp_threads = 0

# Имена выходных файлов
output_profile = solution_1d.csv
output_history = convergence_history.csv
